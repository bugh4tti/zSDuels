# ============================================================
#  zSDuels - config.yml
#  Colores: &a, hex "#RRGGBB" o "&#RRGGBB"
#  Degradado por letra: #FDFF00&lM#FEFF2C&lE
# ============================================================

settings:
  # Comando que se ejecuta al terminar el duelo (sin /)
  spawn-command: "spawn"
  # Los duelos empiezan activados para los jugadores nuevos
  enabled-by-default: true
  countdown-seconds: 5
  # Si el duelo pasa de este tiempo, termina en empate (0 = sin limite)
  max-duel-seconds: 600
  request-expire-seconds: 30
  rematch-expire-seconds: 30
  # No puedes retar si recibiste/diste daño PvP hace menos de X segundos
  combat-block-seconds: 15
  # Cada cuantos segundos se avisa la posicion en la cola
  queue-message-interval: 5
  queue-seconds-per-position: 3
  # Gemas que se ganan al ganar un duelo
  gem-reward: 1
  broadcast-win: true
  # Dentro de la arena
  block-break-place: false
  disable-ender-pearls: true
  disable-item-drop: true
  disable-item-pickup: true
  # Comandos que SI funcionan durante un duelo (sin /)
  allowed-commands:
    - msg
    - tell
    - w
    - r
    - reply
    - duel
    - duels
    - zsduels

top:
  # Cantidad de puestos para los placeholders de hologramas
  size: 10
  refresh-seconds: 30
  empty-name: "---"
  empty-value: "0"

sounds:
  countdown: "block.note_block.pling"
  start: "entity.ender_dragon.growl"
  win: "entity.player.levelup"
  lose: "entity.villager.no"
  request: "entity.experience_orb.pickup"
  click: "ui.button.click"
  error: "entity.villager.no"
  purchase: "entity.player.levelup"

titles:
  countdown:
    title: "&e&l%seconds%"
    subtitle: "&7Prepárate..."
    fade-in: 0
    stay: 20
    fade-out: 5
  start:
    title: "&a&l¡PELEA!"
    subtitle: "&7Kit: &f%kit%"
    fade-in: 0
    stay: 30
    fade-out: 10
  win:
    title: "#55FF55&l¡VICTORIA!"
    subtitle: "&7Venciste a &f%opponent%"
    fade-in: 5
    stay: 50
    fade-out: 10
  lose:
    title: "#FF5555&lDERROTA"
    subtitle: "&7Perdiste contra &f%opponent%"
    fade-in: 5
    stay: 50
    fade-out: 10
  draw:
    title: "&e&lEMPATE"
    subtitle: "&7Se acabó el tiempo"
    fade-in: 5
    stay: 50
    fade-out: 10

